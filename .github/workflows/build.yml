name: Build KClient JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "KClient-1.21.4-v1-source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q "KClient-1.21.4-v1-source.zip" -d work
          echo "Files extracted:"
          find work -maxdepth 4 -type f | head -100
          PROJECT_DIR="$(find work -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) -printf '%h\n' | sort -u | head -1)"
          if [ -z "${PROJECT_DIR}" ]; then
            echo "::error::No Gradle build files found inside the ZIP. Check whether this ZIP contains source code or only compiled files."
            exit 1
          fi
          while [ "${PROJECT_DIR}" != "." ] && [ ! -f "${PROJECT_DIR}/settings.gradle" ] && [ ! -f "${PROJECT_DIR}/settings.gradle.kts" ] && [ ! -f "${PROJECT_DIR}/build.gradle" ] && [ ! -f "${PROJECT_DIR}/build.gradle.kts" ]; do
            PROJECT_DIR="$(dirname "${PROJECT_DIR}")"
          done
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --no-daemon build
          else
            echo "::error::Gradle project root could not be identified."
            exit 1
          fi

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: KClient-JAR
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
